name: Gráfico de dispersión

on:
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  push:
    paths:
      - analisis_dispersion.py

permissions:
  contents: write

jobs:
  graficar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generar análisis y gráficos
        run: python analisis_dispersion.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados
          git diff --cached --quiet || git commit -m "Actualizar gráficos de dispersión"
          git push
